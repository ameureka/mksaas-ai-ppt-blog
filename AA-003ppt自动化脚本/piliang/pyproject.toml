[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "piliang-factory"
version = "5.0.0"
description = "PPT 批量处理与智能化工厂（Piliang）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-pptx>=0.6.21",
  "pyyaml>=6.0",
  "boto3>=1.28",
  "requests>=2.31",
  "pillow>=10.0",
  "rarfile>=4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-mock>=3.14",
  "pytest-asyncio>=1.0",
  "hypothesis>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"

